# The 26.x project, on its own branch. Minecraft 26.1.2 ships unobfuscated, so there are no
# mappings to configure: ModDevGradle resolves the version below and NeoForge runs on the
# game's own names. Build with: .\gradlew build
#
# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G

# Minecraft and NeoForge for this line. Both are single values: this branch targets exactly
# one Minecraft version, so there is no -Pmc switch here (unlike the 1.21.x line).
minecraft_version=26.1.2
neoforge_version=26.1.2.109

# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>", i.e. SemVer plus the
# Minecraft version as build metadata. It stays 0.x until the loader actually runs in the
# game; see docs/VERSIONING.md, and change it only through release/version.ps1.
mod_version_base=1.0.1
maven_group=kynarain.cn
archives_base_name=OptifiNeoforge

# Dependencies
# ASM version to compile against; at runtime NeoForge ships its own copy.
asm_version=9.9.1
