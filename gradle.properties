# The 1.21.x project, on its own branch. This line covers Minecraft 1.21.1 through 1.21.11 with the
# OptiFine builds that exist for them; the default target below is the one the loader has been
# developed and verified against so far. Build with: .\gradlew build
#
# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G

# Minecraft and NeoForge for this line. The values here are the default target: porting the 1.21.x
# build.gradle from 26.x brings the -Pmc switch that picks another version of this line, and these
# stay the fallback when no switch is given.
minecraft_version=1.21.4
neoforge_version=21.4.149

# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>", i.e. SemVer plus the Minecraft
# version as build metadata. It stays 0.x until the loader actually runs in the game; see
# docs/VERSIONING.md, and change it only through release/version.ps1.
mod_version_base=2.0.0
maven_group=kynarain.cn
archives_base_name=OptiNeoforge

# Java 21 is what NeoForge 21.x requires and what the loader is compiled for on this line.
target_java_version=21

# The mount point this line's default target (1.21.4) uses: the ModLauncher 11 transformation
# service and its transformers, compiled from src/ml11/java. NeoForge 21.9 (Minecraft 1.21.9) dropped
# ModLauncher, so on the three targets from there on nothing in this repository has an API to
# register with: those are built with -Pmountpoint=fml10, which compiles no mount-point root and
# produces the loader-side tools and the mod skeleton alone. build.gradle insists on -Pmountpoint
# when -Pmc names something other than the default.
mount_point=modlauncher

# Dependencies
# ASM version to compile against; at runtime NeoForge ships its own copy. This one is pinned
# by the line's NeoForge: 21.4.149 requires asm 9.8 strictly, so the 26.x value 9.10.1 leaves the
# compile classpath unsatisfiable and the build stops before compiling anything.
asm_version=9.10.1
