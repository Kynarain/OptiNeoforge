# The 1.20.x project, on its own branch. This line covers Minecraft 1.20.1, 1.20.2, 1.20.4 and
# 1.20.6; the default target below is the one this line starts with. Build with: .\gradlew build
#
# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G

# Minecraft and NeoForge for this line. Each of these Minecraft versions has its own NeoForge:
# 1.20.1 -> 47.x, 1.20.2 -> 20.2.x, 1.20.4 -> 20.4.x, 1.20.6 -> 20.6.x. Switch with -Pmc together
# with -Pneoforge, which build.gradle insists on, so an unverified pairing cannot look supported.
#
# The default is 1.20.4 because 1.20.1 cannot be resolved by the Gradle plugin as it stands:
# net.neoforged:neoforge:1.20.1-47.1.106 does not exist - that era's artifact is the legacy
# net.neoforged:forge coordinate, and ModDevGradle looked for the neoforge one and failed with
# "Could not find net.neoforged:neoforge:1.20.1-47.1.106". The 1.20.1 line still builds and runs
# through the rig; only the packaged jar waits on that. See docs/MATRIX.md.
minecraft_version=1.20.4
neoforge_version=20.4.251

# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>", i.e. SemVer plus the Minecraft
# version as build metadata. It stays 0.x until the loader actually runs in the game; see
# docs/VERSIONING.md, and change it only through release/version.ps1.
mod_version_base=2.0.0
maven_group=kynarain.cn
archives_base_name=OptiNeoforge

# Java 17 for 1.20.1 to 1.20.4, which is what those NeoForge builds require.
target_java_version=17

# The ModLauncher generation this line's default target runs, which decides which transformer adapter
# is compiled: ModLauncher 10 (1.20.1 to 1.20.4) has no getTargetType() and takes Target as a plain
# nested class, ModLauncher 11 (1.20.6 and later) makes getTargetType() abstract and parameterizes
# Target. Both adapters carry the same class name, so exactly one source root may be compiled.
# build.gradle insists on -Pmodlauncher when -Pmc names something other than the default.
modlauncher_generation=10

# Dependencies
# ASM version to compile against; at runtime NeoForge ships its own copy. This is the version the
# offline tools are verified against - the rig compiles them with the newest ASM in libraries/, which
# is 9.10.1 - and build.gradle forces it for this project's own compileOnly dependencies, because this
# line's NeoForge pins an older one whose Remapper has no API-version constructor. Measured: with the
# pinned older ASM, "gradlew build" fails at :compileJava on SrgRemap's super(Opcodes.ASM9).
asm_version=9.10.1
