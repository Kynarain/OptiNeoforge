plugins {
    // NeoForge's own Gradle plugin (see settings.gradle for its repository). It resolves
    // Minecraft and NeoForge, wires the development runs and builds the mod jar.
    id 'net.neoforged.moddev'
}

// The 1.21.x line covers several Minecraft versions, so the target is switchable:
//
//   .\gradlew build                        -> the default target from gradle.properties
//   .\gradlew build -Pmc=1.21.8 -Pneoforge=21.8.52
//
// NeoForge changes with the Minecraft version, and no table of those pairings is baked in here:
// a version that has not been verified on this line would otherwise look supported. When -Pmc
// names something other than the default, -Pneoforge is required, so the pairing is always
// stated by whoever asks for it. docs/MATRIX.md is where verified pairings are recorded.
def defaultMc = project.minecraft_version.toString()
def defaultNeoForge = project.neoforge_version.toString()
def targetMc = (project.findProperty('mc') ?: defaultMc).toString()
def targetNeoForge = project.findProperty('neoforge')?.toString()
if(targetNeoForge == null){
    if(targetMc != defaultMc){
        throw new GradleException(
            "no NeoForge version recorded for Minecraft ${targetMc}: pass -Pneoforge=<version>, " +
            "and record the pairing in docs/MATRIX.md once it is verified")
    }
    targetNeoForge = defaultNeoForge
}

// The mount point decides which source root is compiled, because this line spans the last
// ModLauncher generation and the first one without it. NeoForge 21.9 (Minecraft 1.21.9) dropped
// ModLauncher, and with it cpw.mods.modlauncher.api: measured on 1.21.11 (21.11.45), ":compileJava"
// stopped with "错误: 程序包cpw.mods.modlauncher.api不存在" - 100 errors, every one of them in the
// transformation service and the transformers that implement cpw.mods.modlauncher.api.ITransformer.
// Those classes sat in src/main, so nothing here could build 1.21.9 / 1.21.10 / 1.21.11 at all;
// they now live in a source root of their own and are compiled only where ModLauncher exists.
//
//   -Pmountpoint=modlauncher  -> compile src/ml11/java (Minecraft 1.21 to 1.21.8, ModLauncher 11)
//   -Pmountpoint=fml10        -> compile no mount-point root (Minecraft 1.21.9 and later). Those
//                                lines have no ModLauncher for anything to register with, and their
//                                mount point is the FML 10 ClassProcessor that the rig compiles into
//                                the payload jar (26.x's src/fml10) - a jar that carries OptiFine's
//                                classes and is not distributed. This build therefore produces the
//                                loader-side tools and the mod skeleton alone, which is the same kind
//                                of artifact the 26.x line publishes for 26.1.2.
//
// Same rule as -Pneoforge: a target that was not verified has to be stated rather than guessed.
def defaultMountPoint = project.mount_point.toString()
def targetMountPoint = project.findProperty('mountpoint')?.toString()
if(targetMountPoint == null){
    if(targetMc != defaultMc){
        throw new GradleException(
            "no mount point recorded for Minecraft ${targetMc}: pass -Pmountpoint=modlauncher " +
            "(1.21 to 1.21.8) or -Pmountpoint=fml10 (1.21.9 and later), and record the line in " +
            "docs/MATRIX.md once it is verified")
    }
    targetMountPoint = defaultMountPoint
}
if(!(targetMountPoint in ['modlauncher', 'fml10'])){
    throw new GradleException("unknown mount point '${targetMountPoint}': expected modlauncher or fml10")
}
if(targetMountPoint == 'fml10'){
    // The FML 10 mount point: the ClassProcessor that replaces the game's own classes with the
    // finished ones the rig applied OptiFine's patch data to, plus the locator that makes the jar an
    // early-service jar (FML 10's EarlyServiceDiscovery.SERVICES does not include ClassProcessor, so
    // without the locator the processor service file is never read).
    //
    // This source root arrived on 26.x first, for 26.1.2, and the three 1.21.9-1.21.11 lines cannot
    // work without it either, so it is compiled here as well rather than staying a file the rig
    // compiles by hand- which is what it was until this round: the tested payload jar carried a
    // class no repository revision built.
    sourceSets.main.java.srcDir 'src/fml10/java'
    sourceSets.main.resources.srcDir 'src/fml10/resources'
}
if(targetMountPoint == 'modlauncher'){
    sourceSets.main.java.srcDir 'src/ml11/java'
    // The registration, without which the classes above are never called. ModLauncher finds a
    // transformation service by the service file
    // META-INF/services/cpw.mods.modlauncher.api.ITransformationService, and this repository had no
    // such file on any branch - checked with git ls-tree across main, 1.20.x, 1.21.x and 26.x, and
    // confirmed by building: the jars carried zero META-INF/services entries. A jar that implements the
    // interface but never declares it is inert, so every released 1.20.x and 1.21.x loader jar was, and
    // the loader's transformations could only ever run for whoever reassembled the jar by hand. This
    // file lives under the mount-point source root rather than in src/main because the fml10 targets
    // have no ModLauncher to register with.
    sourceSets.main.resources.srcDir 'src/ml11/resources'
}

version = "${project.mod_version_base}+mc${targetMc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Every version on this line runs on Java 21; the value lives in gradle.properties so all three
// lines state their own requirement in the same place.
def targetJavaVersion = Integer.parseInt(project.target_java_version.toString())

neoForge {
    version = targetNeoForge

    // This mod is client only, so only the client run is set up. `runClient` is for
    // development; a released jar is a normal mod jar in build/libs.
    runs {
        client {
            client()
        }
    }

    mods {
        optifineoforge {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // ModDevGradle puts Minecraft and NeoForge on the compile classpath by itself, and the
    // NeoForge distribution provides Loader, ModLauncher, ASM and Mixin at runtime. Nothing
    // is bundled into the mod jar; these are compile-time only.
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', targetMc
    inputs.property 'neoforge_version', targetNeoForge
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version,
                'minecraft_version': targetMc,
                'neoforge_version': targetNeoForge
    }
}

tasks.named('build') {
    doFirst {
        println "Building ${project.archives_base_name} ${project.version} (Minecraft ${targetMc}, " +
                "NeoForge ${targetNeoForge}, Java ${targetJavaVersion}, mount point ${targetMountPoint})"
    }
}

// The offline tools (kynarain.cn.optifineoforge.optifine) compile against the ASM version named in
// gradle.properties, not against the one NeoForge 21.4.149 pins: its modDevApiElements demands
// org.ow2.asm:asm STRICTLY 9.8, and SrgRemap needs the API-version Remapper(int) constructor that
// 9.8 does not have - measured: "cannot apply Remapper's constructor to the given types". Raising
// asm_version alone cannot work (the classpath stops resolving), and using the no-argument
// constructor instead changes what the remap produces - measured on 1.21: the payload grew by 501
// bytes and the run died with "AbstractMethodError: Receiver class
// net.minecraft.client.particle.ParticleEngine$$Lambda ... ParticleProvider create(SpriteSet)". So
// the Gradle build takes the version the tools are verified with, and only for this project's own
// compileOnly dependencies.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion project.asm_version
            details.because 'the tools are verified against this ASM version; NeoForge pins 9.8 strictly'
        }
    }
}