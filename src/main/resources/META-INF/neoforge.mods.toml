# Mod metadata for this line. ModDevGradle expands the placeholders below from
# gradle.properties at build time (see build.gradle), and NeoForge reads this file from
# META-INF/neoforge.mods.toml inside the jar.
#
# 26.1.2 is a client-side concern only: OptiFine is a client mod and so is this loader.

modLoader = "javafml"
# The FancyModLoader version range this mod needs. NeoForge's own FML is always present,
# so this stays permissive; it is not the NeoForge version.
loaderVersion = "[1,)"
license = "MPL-2.0"
issueTrackerURL = "https://github.com/Kynarain/OptifiNeoforge/issues"

[[mods]]
modId = "optifineoforge"
version = "${version}"
displayName = "OptifiNeoforge"
# Keep this short: it is what the mod list shows. The wording is deliberately checkable rather than reassuring:
# unzip the jar and the claims below can be verified in one command. It used to say "OptiFine itself is not bundled
# or redistributed", which was not true - two post-effect definitions derived from OptiFine's own files shipped in
# this jar (assets/minecraft/post_effect/fxaa_of_{2,4}x.json). They are now authored here (see docs/PUBLISHING.md),
# so the statement below holds and can be tested.
description = '''Loads OptiFine into NeoForge. Put the OptiFine jar for ${minecraft_version} next to this mod; OptifiNeoforge patches and applies it at runtime. This jar contains no OptiFine code: no net.optifine classes and no file copied from OptiFine. Not affiliated with or endorsed by OptiFine or NeoForge.'''
authors = "kynarain"

[[dependencies.optifineoforge]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.optifineoforge]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
