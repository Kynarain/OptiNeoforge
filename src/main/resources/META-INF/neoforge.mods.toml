# Mod metadata for this line. build.gradle expands the placeholders below at build time, and the
# name this file is written under inside the jar is chosen per target as well: the 20.2 and 20.4
# loaders read META-INF/mods.toml and only that, while 20.6 reads either name. See build.gradle.
#
# This line is a client-side concern only: OptiFine is a client mod and so is this loader.

modLoader = "javafml"
# The FancyModLoader version range this mod needs. NeoForge's own FML is always present,
# so this stays permissive; it is not the NeoForge version.
loaderVersion = "[1,)"
license = "MPL-2.0"
issueTrackerURL = "https://github.com/Kynarain/OptifiNeoforge/issues"

[[mods]]
modId = "optifineoforge"
version = "${version}"
displayName = "OptifiNeoforge"
# Keep this short: it is what the mod list shows.
description = '''Loads OptiFine into NeoForge. Put the OptiFine jar for ${minecraft_version} next to this mod; OptifiNeoforge patches and applies it at runtime. This jar contains no OptiFine code: no net.optifine classes and no file copied from OptiFine. Not affiliated with or endorsed by OptiFine or NeoForge.'''
authors = "kynarain"

# Both the id and the version below are the mod's, not the Maven artifact's, and on 1.20.1 the two
# pairs differ from every other target on this line: NeoForge 47.1.106 declares itself as mod id
# "forge" (displayName "NeoForge") at version 47.1.106, while its artifact is
# net.neoforged:forge:1.20.1-47.1.106. Naming "neoforge" there would require a mod that the
# distribution does not contain. From 20.2.88 onwards the id is "neoforge" and the mod version
# equals the artifact version.
[[dependencies.optifineoforge]]
modId = "${neoforge_modid}"
type = "required"
versionRange = "[${neoforge_modversion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.optifineoforge]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
